# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: capture unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

  client-game-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      # Minecraft 26.3's SDL OpenGL window needs EGL under Xvfb.
      SDL_VIDEO_FORCE_EGL: '1'
      ALSOFT_DRIVERS: pulse
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install display and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 pulseaudio pulseaudio-utils
      - name: start virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=codon
          pactl set-default-sink codon
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game tests
        # Leave room for the native suite on software-rendered CI runners.
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p build/ci
          touch build/ci/client-game-test.log
          # Keep thread stacks when a stalled client cannot report a test failure.
          (
            while sleep 60; do
              if [[ -n "$(find build/ci/client-game-test.log -mmin +2 -print)" ]]; then
                for pid in $(jps -q); do
                  timeout 15s jcmd "$pid" Thread.print -l > "build/ci/thread-dump-$pid.txt" 2>&1 || true
                done
                break
              fi
            done
          ) &
          diagnostic_pid=$!
          trap 'kill "$diagnostic_pid" 2>/dev/null || true' EXIT
          xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew --no-daemon runClientGameTest --stacktrace 2>&1 | tee build/ci/client-game-test.log
      - name: capture client game test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-game-test-evidence
          path: |
            build/ci/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/hs_err_pid*.log
          retention-days: 14
